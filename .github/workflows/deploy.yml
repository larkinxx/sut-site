# Публикация сайта на GitHub Pages: срабатывает при каждом изменении в репозитории,
# после каждого прогона автосбора новостей (иначе новые карточки не попали бы на сайт) и вручную кнопкой «Run workflow».
name: Опубликовать сайт

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Собрать новости и черновики"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Адрес сайта
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "SITE_URL=${{ vars.SITE_URL }}" >> "$GITHUB_ENV"
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
            echo "BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - name: Проверка содержимого
        run: npm run check
      - name: Сборка
        run: node src/build.mjs --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
