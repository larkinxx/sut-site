# Автосбор новостей и публикация без участия человека. Каждый час (и по кнопке «Run workflow»):
# 1) читает RSS-ленты из config/sources.json, 2) просит ИИ подготовить карточки,
# 3) обычные карточки, прошедшие автопроверки, сразу получают status = published; важные и сомнительные
#    остаются черновиками (draft) и ждут человека, 4) сохраняет результат; затем сайт пересобирается сам (deploy.yml).
# Шаг с ИИ пропускается, пока в Settings → Secrets не добавлен ANTHROPIC_API_KEY (Claude) или GEMINI_API_KEY (Google Gemini).
name: Собрать новости и черновики

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сбор новостей
        run: npm run fetch
      - name: Черновики от ИИ
        if: env.HAS_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTO_PUBLISH: "true"
        run: npm run draft
      - name: Сохранить
        run: |
          git config user.name "sut-bot"
          git config user.email "sut-bot@users.noreply.github.com"
          mkdir -p content/news content/raw
          git add content/news content/raw
          if git diff --cached --quiet; then
            echo "Новых материалов нет"
          else
            git commit -m "Новые новости"
            git pull --rebase origin main
            git push
          fi
